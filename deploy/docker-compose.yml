# Production stack for the Ubuntu 24.04 VPS (Phase 2).
# Run from the repository root via deploy/scripts/*.sh - see docs/phase-2-vps.md.
# Settings come from deploy/.env (created by deploy/scripts/init-env.sh, never committed).
#
# Only Caddy publishes ports (80/443). Postgres, n8n and the API are reachable only
# inside the private Docker network. Note: ports published by Docker bypass ufw.

name: qgm

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qgm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-qgm}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: qgm-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in deploy/.env}
      DATABASE_URL: postgres://${POSTGRES_USER:-qgm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qgm}
      JOB_WORKER_ENABLED: ${JOB_WORKER_ENABLED:-true}
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-2000}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_STALE_LOCK_MINUTES: ${JOB_STALE_LOCK_MINUTES:-15}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-6.2-sol}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.6-flare}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      OPENAI_IMAGE_HOOK_QUALITY: ${OPENAI_IMAGE_HOOK_QUALITY:-high}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1008x1792}
      OPENAI_IMAGE_CONCURRENCY: ${OPENAI_IMAGE_CONCURRENCY:-2}
      OPENAI_MAX_USD_PER_RUN: ${OPENAI_MAX_USD_PER_RUN:-2}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_v4}
      ELEVENLABS_MAX_USD_PER_RUN: ${ELEVENLABS_MAX_USD_PER_RUN:-0.5}
      BLOTATO_API_KEY: ${BLOTATO_API_KEY:-}
      BLOTATO_YOUTUBE_PRIVACY: ${BLOTATO_YOUTUBE_PRIVACY:-private}
      # Daily automation (docs/publishing.md "Full automation").
      AUTOMATION_BRANDS: ${AUTOMATION_BRANDS:-quiet-growth,behtar-bano,ninnu-nuvvu-geluvu}
      SCHEDULE_LEAD_DAYS: ${SCHEDULE_LEAD_DAYS:-1}
      DAILY_MAX_USD: ${DAILY_MAX_USD:-3}
      PIPELINE_RENDER_MODE: ${PIPELINE_RENDER_MODE:-final}
      PIPELINE_DATA_DIR: data/pipeline
      PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
    volumes:
      - media_data:/app/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.48.4}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in deploy/.env}
      N8N_HOST: ${N8N_DOMAIN:?Set N8N_DOMAIN in deploy/.env}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: 1
      # Workflows must not read container env vars (they hold the DB password and encryption key).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
      - n8n
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
      N8N_DOMAIN: ${N8N_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  n8n_data:
  media_data:
  caddy_data:
  caddy_config:
